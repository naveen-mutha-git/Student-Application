<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

    <h1>Welcome to Student Dashboard</h1>
    <p class="subtitle">Manage your student information</p>

    <div class="dashboard">

        <a href="/profile">
            <div class="card">
                <h2>👤</h2>
                <h3>Student Profile</h3>
                <p>View personal details</p>
            </div>
        </a>

        <a href="/courses">
            <div class="card">
                <h2>📚</h2>
                <h3>Courses</h3>
                <p>View enrolled courses</p>
            </div>
        </a>

        <a href="/grades">
            <div class="card">
                <h2>📊</h2>
                <h3>Grades</h3>
                <p>Check marks & grades</p>
            </div>
        </a>

        <a href="/notifications">
            <div class="card">
                <h2>🔔</h2>
                <h3>Notifications</h3>
                <p>Latest updates</p>
            </div>
        </a>

    </div>

    <div class="logout-box">
        <button onclick="logout()">Logout</button>
    </div>

</div>

<script>
function logout() {
    localStorage.removeItem("studentId");
    window.location.href = "/login";
}
</script>

</body>
</html>
